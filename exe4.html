<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>
</head>
<body>
    <h1>CONSOLE THINGS 102</h1>
    <input id="number" type="number">
    <input type="button" onclick="tabuada()" value="Exibir no console">
<script>
function tabuada(){
  var number = parseInt(document.getElementById("number").value);
  var tabuada='';

  for(var count=1; count<=10 ; count++)
   tabuada += number+" x "+count+" = "+
                            number*count+"<br />"; 
 console.count();
}
</script> 
</body>
</html>
